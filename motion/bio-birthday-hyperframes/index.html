<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #dcebfb; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #banner { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

      /* A shine layer = full-frame box clipped to one object's alpha mask */
      .shine {
        position: absolute; inset: 0; overflow: hidden;
        -webkit-mask-size: 1920px 1080px; mask-size: 1920px 1080px;
        -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      }
      .shine .band {
        position: absolute; top: -300px; left: 0;
        height: 1680px; transform: translateX(-600px) rotate(22deg);
        background: linear-gradient(90deg,
          rgba(255,255,255,0) 0%,
          rgba(255,252,244,0.18) 30%,
          rgba(255,255,255,0.70) 50%,
          rgba(255,252,244,0.18) 70%,
          rgba(255,255,255,0) 100%);
      }
      #shine-text   { -webkit-mask-image: var(--m-text);   mask-image: var(--m-text); }
      #shine-scoot  { -webkit-mask-image: var(--m-scoot);  mask-image: var(--m-scoot); }
      #shine-ipad   { -webkit-mask-image: var(--m-ipad);   mask-image: var(--m-ipad); }
      #shine-person { -webkit-mask-image: var(--m-person); mask-image: var(--m-person); }
      #shine-cream  { -webkit-mask-image: var(--m-cream);  mask-image: var(--m-cream); }

      .prize { position: absolute; inset: 0; will-change: transform; }
      .prize img { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }

      .spark {
        position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0;
        background:
          radial-gradient(circle, rgba(255,255,255,1) 0 2px, rgba(255,255,255,0) 6px),
          linear-gradient(90deg, transparent 46%, rgba(255,255,255,.9) 50%, transparent 54%),
          linear-gradient(0deg,  transparent 46%, rgba(255,255,255,.9) 50%, transparent 54%);
        mix-blend-mode: screen;
      }
    </style>

        <div id="shine-text"   class="shine"><div class="band" style="width:150px"></div></div>
        <div id="shine-person" class="shine"><div class="band" style="width:220px"></div></div>
        <div id="shine-cream"  class="shine"><div class="band" style="width:160px"></div></div>
        <div id="prize-scoot" class="prize" style="transform-origin:487px 994px">
          <img src="assets/cut_scoot.png" alt="" />
          <div id="shine-scoot" class="shine"><div class="band" style="width:170px"></div></div>
        </div>
        <div id="prize-ipad" class="prize" style="transform-origin:925px 990px">
          <img src="assets/cut_ipad.png" alt="" />
          <div id="shine-ipad" class="shine"><div class="band" style="width:150px"></div></div>
        </div>
        <div class="spark" style="left:542px;top:108px"></div>
        <div class="spark" style="left:718px;top:200px"></div>
        <div class="spark" style="left:870px;top:486px"></div>
        <div class="spark" style="left:1085px;top:768px"></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Gentle breathing zoom that returns to start -> seamless loop
      tl.fromTo("#stage", { scale: 1 }, { scale: 1.02, duration: 3, ease: "sine.inOut" }, 0);
      tl.to("#stage", { scale: 1, duration: 3, ease: "sine.inOut" }, 3);

      // One soft sweep per element, staggered.  [selector, start, duration, opacity, x-from, x-to]
      const sweeps = [
        ["#shine-text",   0.3, 1.8, 0.75, -400, 2200],
        ["#shine-scoot",  1.4, 1.1, 0.55, -300, 1000],
        ["#shine-ipad",   2.0, 0.9, 0.70,  500, 1350],
        ["#shine-person", 2.7, 1.5, 0.30,  700, 1900],
        ["#shine-cream",  3.4, 1.1, 0.55, 1000, 2100],
      ];
      sweeps.forEach(([sel, t, d, op, x0, x1]) => {
        const band = document.querySelector(sel + " .band");
        tl.set(band, { opacity: op }, 0);
        tl.fromTo(band, { x: x0, rotation: 22 }, { x: x1, rotation: 22, duration: d, ease: "power2.inOut" }, t);
      });

      // Prize bounce: anticipate squash -> hop with stretch -> land squash -> elastic settle
      function bounce(sel, t, lift, stretch = 1.06) {
        tl.to(sel, { scaleX: 1.05, scaleY: 0.92, duration: 0.14, ease: "power1.out" }, t);
        tl.to(sel, { y: -lift, scaleX: 2 - stretch, scaleY: stretch, duration: 0.24, ease: "power2.out" }, t + 0.14);
        tl.to(sel, { y: 0, scaleX: 1, scaleY: 1, duration: 0.2, ease: "power2.in" }, t + 0.38);
        tl.to(sel, { scaleX: 1.04, scaleY: 0.95, duration: 0.07, ease: "power1.out" }, t + 0.58);
        tl.to(sel, { scaleX: 1, scaleY: 1, duration: 0.5, ease: "elastic.out(1, 0.45)" }, t + 0.65);
      }
      tl.set(["#prize-scoot", "#prize-ipad"], { x: 0, y: 0, scaleX: 1, scaleY: 1 }, 0);
      bounce("#prize-scoot", 0.5, 30);
      bounce("#prize-ipad", 0.8, 10, 1.02);
      bounce("#prize-scoot", 3.5, 30);
      bounce("#prize-ipad", 3.8, 10, 1.02);

      // Small, sparse twinkles
      [[0, 0.9], [1, 1.6], [2, 2.4], [3, 2.6]].forEach(([i, t]) => {
        const el = document.querySelectorAll(".spark")[i];
        tl.fromTo(el, { opacity: 0, scale: 0.3, rotation: 0 }, { opacity: 0.8, scale: 1, rotation: 45, duration: 0.35, ease: "power2.out" }, t);
        tl.to(el, { opacity: 0, scale: 0.3, rotation: 90, duration: 0.45, ease: "power2.in" }, t + 0.35);
      });

      tl.set({}, {}, 6);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
